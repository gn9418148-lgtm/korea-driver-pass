<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Cancelled | KoreaPass</title>
<style>
  body { background: #0d1b2a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
  .card { background: #1b263b; border-radius: 18px; padding: 32px 24px; max-width: 420px; width: 100%; text-align: center; border: 1.5px solid #ef476f; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .icon { font-size: 48px; color: #ef476f; margin-bottom: 14px; }
  h1 { font-size: 21px; margin: 0 0 10px; color: #ef476f; }
  p { font-size: 14.5px; color: #cbd5e1; line-height: 1.6; margin-bottom: 22px; }
  .err { font-size: 12px; color: #8da4c4; margin-bottom: 18px; word-break: break-word; }
  .btn { display: block; background: #00b4d8; color: #04131d; padding: 15px; border-radius: 99px; text-decoration: none; font-weight: 800; font-size: 15.5px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✕</div>
  <h1 id="f-title">Payment Cancelled or Failed</h1>
  <p id="f-desc">No charge was made. Please return to the study page and try again.</p>
  <div class="err" id="f-err"></div>
  <a href="./" id="btn-retry" class="btn">Try Again →</a>
</div>
<script>
  const p = new URLSearchParams(window.location.search);
  const lang = p.get('lang') || localStorage.getItem('koreapass_lang') || 'en';
  const code = p.get('code') || '';
  const msg = p.get('message') || '';

  const TEXT = {
    ko: { title: "결제가 취소되었거나 실패했습니다", desc: "결제 금액은 청구되지 않았습니다. 아래 버튼을 눌러 다시 시도해 주세요.", btn: "문제로 돌아가기 →" },
    uz: { title: "To'lov bekor qilindi yoki xatolik yuz berdi", desc: "Pul yechilmadi. Pastdagi tugmani bosib qayta urinib ko'ring.", btn: "Qayta urinib ko'rish →" },
    ne: { title: "भुक्तानी रद्द वा असफल भयो", desc: "कुनै रकम काटिएको छैन। कृपया तलको बटन थिचेर फेरि प्रयास गर्नुहोस्।", btn: "फेरि प्रयास गर्नुहोस् →" },
    vi: { title: "Thanh toán bị hủy hoặc thất bại", desc: "Chưa có khoản tiền nào bị trừ. Vui lòng nhấn nút bên dưới để thử lại.", btn: "Thử lại ngay →" },
    en: { title: "Payment Cancelled or Failed", desc: "No charge was made to your card. Tap below to return and try again.", btn: "Return & Try Again →" },
    zh: { title: "支付已取消或未完成", desc: "尚未扣款，请点击下方按钮返回页面重试。", btn: "返回重新支付 →" },
    ru: { title: "Оплата отменена или не прошла", desc: "Средства не были списаны. Нажмите кнопку ниже, чтобы вернуться и попробовать снова.", btn: "Вернуться и повторить →" },
    id: { title: "Pembayaran Dibatalkan atau Gagal", desc: "Tidak ada biaya yang dipotong. Ketuk tombol di bawah untuk kembali dan coba lagi.", btn: "Kembali & Coba Lagi →" }
  };

  const t = TEXT[lang] || TEXT.en;
  document.documentElement.lang = lang;
  document.getElementById('f-title').innerText = t.title;
  document.getElementById('f-desc').innerText = t.desc;
  document.getElementById('btn-retry').innerText = t.btn;
  document.getElementById('btn-retry').href = './?lang=' + encodeURIComponent(lang);
  if (code || msg) {
    document.getElementById('f-err').innerText = [code, msg].filter(Boolean).join(' · ');
  }
</script>
</body>
</html>
