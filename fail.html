<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 실패 - KoreaPass</title>
<style>
body { background: #0d1b2a; color: #fff; font-family: sans-serif; text-align: center; padding: 50px 20px; }
.card { background: #1b263b; border-radius: 16px; padding: 30px; max-width: 400px; margin: 0 auto; border: 1px solid #ef476f; }
.icon { font-size: 50px; color: #ef476f; margin-bottom: 20px; }
h1 { font-size: 24px; margin-bottom: 10px; color: #ef476f; }
p { font-size: 15px; color: #8da4c4; line-height: 1.6; margin-bottom: 25px; }
.btn { display: block; background: #2b3a4a; color: #fff; padding: 14px; border-radius: 99px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✕</div>
  <h1>결제가 취소되었거나 실패했습니다</h1>
  <p>To'lov bekor qilindi yoki xatolik yuz berdi.<br>Payment failed or cancelled.<br><br>다시 시도해 주시기 바랍니다.</p>
  <a href="./" id="btn-retry" class="btn">다시 시도하기 (Try Again)</a>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const lang = p.get('lang');
if (lang) {
  document.getElementById('btn-retry').href = './?lang=' + encodeURIComponent(lang);
}
</script>
</body>
</html>
