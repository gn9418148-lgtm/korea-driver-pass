<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결제 완료 - KoreaPass</title>
<style>
body { background: #0d1b2a; color: #fff; font-family: sans-serif; text-align: center; padding: 50px 20px; }
.card { background: #1b263b; border-radius: 16px; padding: 30px; max-width: 400px; margin: 0 auto; border: 1px solid #2b3a4a; }
.icon { font-size: 50px; color: #06d6a0; margin-bottom: 20px; }
h1 { font-size: 24px; margin-bottom: 10px; color: #06d6a0; }
p { font-size: 15px; color: #8da4c4; line-height: 1.6; margin-bottom: 25px; }
.btn { display: block; background: #00b4d8; color: #fff; padding: 14px; border-radius: 99px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1 id="suc-title">결제가 완료되었습니다!</h1>
  <p id="suc-desc">To'lov muvaffaqiyatli amalga oshirildi!<br>भुक्तानी सफल भयो!<br>Payment Successful!<br><br>이제 60일간 선택하신 언어의 1,000문항 전체와 모의고사를 무제한으로 이용하실 수 있습니다.</p>
  <a href="./" id="btn-start" class="btn">학습 시작하기 (Start Learning)</a>
</div>
<script>
// 결제창에서 넘어온 언어 파라미터 확인 (?lang=uz 등)
const urlParams = new URLSearchParams(window.location.search);
const payLang = urlParams.get('lang') || 'ko';

// 해당 언어만 잠금 해제 (타 언어 차단 격리)
localStorage.setItem('koreapass_unlocked_' + payLang, 'true');

// 학습 시작하기 버튼에도 해당 언어 파라미터 전달
document.getElementById('btn-start').href = './?lang=' + payLang;
</script>
</body>
</html>
